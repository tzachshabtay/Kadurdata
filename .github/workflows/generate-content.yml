name: Generate Hebrew Content

on:
  workflow_dispatch:
    inputs:
      match_id:
        description: "Optional Kadurdata match UUID. Blank selects the latest completed Ligat Ha'Al match with full data."
        required: false
        default: ""
  schedule:
    - cron: "35 7 * * 1,4"

permissions:
  contents: write

concurrency:
  group: generate-hebrew-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://zmmubdmuqwpihyptlxrg.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.CONTENT_OPENAI_MODEL || 'gpt-5-mini' }}
      OPENAI_EDITOR_MODEL: ${{ vars.CONTENT_OPENAI_EDITOR_MODEL || 'gpt-5.6' }}
      OPENAI_QA_MODEL: ${{ vars.CONTENT_OPENAI_QA_MODEL || vars.CONTENT_OPENAI_EDITOR_MODEL || 'gpt-5.6' }}
      MATCH_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.match_id || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        run: |
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "SUPABASE_ANON_KEY is required" && exit 1)
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is required" && exit 1)

      - name: Generate grounded Hebrew article
        run: |
          args=()
          if [ -n "$MATCH_ID" ]; then
            args+=(--match-id "$MATCH_ID" --force)
          fi
          node scripts/generate_content_article.mjs "${args[@]}"

      - name: Validate evidence and build
        run: |
          npm run content:validate
          npm run build

      - name: Publish generated content to the repository
        run: |
          if git diff --quiet -- src/content/generated; then
            echo "No new article was generated."
            exit 0
          fi
          git config user.name "kadurdata-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/generated
          git commit -m "content: publish generated Hebrew article"
          git push
