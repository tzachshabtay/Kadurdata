name: Seed Supabase

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify required secrets
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "SUPABASE_DB_URL secret is required" && exit 1)

      - name: Validate Supabase DB URL
        run: python scripts/validate_supabase_db_url.py

      - name: Apply database migrations
        run: python scripts/apply_migrations.py

      - name: Fetch and flatten 365Scores data
        run: python scripts/ingest_365scores.py

      - name: Load Supabase
        run: python scripts/load_365scores_to_supabase.py
