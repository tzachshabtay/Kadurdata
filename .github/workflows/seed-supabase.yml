name: Seed Supabase

on:
  workflow_dispatch:
    inputs:
      seed_limit:
        description: "Number of matches to seed for a manual run. Use 0 for the full date window."
        required: false
        default: "50"
  schedule:
    - cron: "17 3 * * *"

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SEED_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_limit || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify required secrets
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "SUPABASE_DB_URL secret is required" && exit 1)

      - name: Validate Supabase DB URL
        run: python scripts/validate_supabase_db_url.py

      - name: Apply database migrations
        run: python scripts/apply_migrations.py

      - name: Fetch and flatten 365Scores data
        run: |
          args=(--allow-fetch-failures --retries 4 --sleep 1)
          if [ "${SEED_LIMIT:-0}" != "0" ]; then
            args+=(--limit "$SEED_LIMIT")
          fi
          python scripts/ingest_365scores.py "${args[@]}"

      - name: Load Supabase
        run: python scripts/load_365scores_to_supabase.py
