name: Seed Supabase

on:
  workflow_dispatch:
    inputs:
      seed_mode:
        description: "Full backfill, fixtures only, or a small recent refresh."
        required: false
        default: "full"
        type: choice
        options:
          - full
          - fixtures
          - recent
          - legionnaires
      seed_limit:
        description: "Matches per competition. Use 0 for every match in the selected window."
        required: false
        default: "0"
      competition_ids:
        description: "Optional comma-separated 365Scores competition IDs. Blank means domestic, UEFA, and national-team competitions."
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * *"

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SEED_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_limit || '0' }}
      SEED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_mode || 'recent' }}
      COMPETITION_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.competition_ids || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify required secrets
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "SUPABASE_DB_URL secret is required" && exit 1)

      - name: Validate Supabase DB URL
        run: python scripts/validate_supabase_db_url.py

      - name: Apply database migrations
        run: python scripts/apply_migrations.py

      - name: Fetch and flatten 365Scores data
        if: env.SEED_MODE != 'legionnaires'
        run: |
          args=(
            --all-israeli-competitions
            --israel-related-competitions
            --allow-fetch-failures
            --retries 4
            --page-retries 1
            --sleep 0.25
            --workers 8
          )
          if [ -n "$COMPETITION_IDS" ]; then
            args+=(--competition-ids "$COMPETITION_IDS")
          fi
          if [ "$SEED_MODE" = "fixtures" ]; then
            args+=(--fixtures-only)
          elif [ "$SEED_MODE" = "recent" ]; then
            args+=(
              --start-date "$(date -u -d '14 days ago' +%F)"
              --end-date "$(date -u -d '370 days' +%F)"
            )
          else
            args+=(--start-date "2010-07-01")
          fi
          if [ "${SEED_LIMIT:-0}" != "0" ]; then
            args+=(--limit "$SEED_LIMIT" --max-fixture-pages 5)
          fi
          python scripts/ingest_365scores.py "${args[@]}"

      - name: Load Supabase
        if: env.SEED_MODE != 'legionnaires'
        run: python scripts/load_365scores_to_supabase.py

      - name: Fetch and flatten legionnaire data
        run: |
          args=(
            --allow-fetch-failures
            --retries 4
            --page-retries 1
            --sleep 0.25
            --workers 8
          )
          if [ "$SEED_MODE" = "fixtures" ]; then
            args+=(--fixtures-only)
          elif [ "$SEED_MODE" = "recent" ]; then
            args+=(
              --start-date "$(date -u -d '14 days ago' +%F)"
              --end-date "$(date -u -d '370 days' +%F)"
            )
          else
            args+=(
              --start-date "$(date -u -d '900 days ago' +%F)"
              --end-date "$(date -u -d '370 days' +%F)"
            )
          fi
          if [ "${SEED_LIMIT:-0}" != "0" ]; then
            args+=(--limit "$SEED_LIMIT" --max-fixture-pages 5)
          fi
          python scripts/ingest_legionnaires.py "${args[@]}"

      - name: Load legionnaire data
        run: python scripts/load_365scores_to_supabase.py --processed-dir data/processed/legionnaires

      - name: Synchronize FotMob rosters and loans
        run: |
          python scripts/sync_fotmob_loans.py \
            --allow-fetch-failures \
            --retries 4 \
            --sleep 0.25 \
            --workers 6

      - name: Synchronize historical Transfermarkt loans
        continue-on-error: true
        run: |
          python scripts/sync_transfermarkt_loans.py \
            --lookback-years 2 \
            --allow-fetch-failures \
            --retries 4 \
            --sleep 0.3 \
            --workers 6

      - name: Populate Hebrew player names
        run: |
          python scripts/backfill_hebrew_player_names.py \
            --allow-fetch-failures \
            --retries 4 \
            --sleep 0.25 \
            --workers 6
