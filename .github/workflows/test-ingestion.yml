name: Test Ingestion

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/test_*.py'
      - 'db/migrations/**'
      - '.github/workflows/test-ingestion.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/test_*.py'
      - 'db/migrations/**'
      - '.github/workflows/test-ingestion.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kadurdata_test
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test loaders and ingestion with real PostgreSQL constraints
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/kadurdata_test
        run: python -m unittest discover -s tests -p 'test_*.py'
